# The Court's PUBLIC documents — orders, office reports and judgments — for every case the cause lists give a diary
# number for (owner, 28 Oct 2026). These are served with no login and no CAPTCHA; the case file (which is login-gated)
# is never touched here. Runs three times a day OUTSIDE court hours (16:00, 21:30, 03:00 IST, about 5h20m each), ONE
# request at a time with a short pause, and carries on from where the last run stopped (progress in the gatekeeper).
# It backs off and stops for the night if the Court's site pushes back; it never rotates addresses to evade a block.
# Nothing is kept on GitHub.
name: SC public documents archive (nightly)
on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "0 16 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional: only this many cases (a test)"
        required: false
        default: ""
concurrency:
  group: scorders
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GATEKEEPER_URL: https://asdc-gatekeeper.sdentertainmentservices.workers.dev
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
      PAUSE: "0.5"
    steps:
      - uses: actions/checkout@v4
      - name: Get the engine (kept privately in the gatekeeper, not in this public repo)
        env:
          GATEKEEPER_URL: https://asdc-gatekeeper.sdentertainmentservices.workers.dev
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          curl -sf -A "ASDC engine fetch" -X POST "$GATEKEEPER_URL/api/ingest/kvget" -H "X-Ingest-Key: $INGEST_KEY" \
               -H "Content-Type: application/json" -d '{"key":"sci:engine"}' -o engine.json
          python3 -c "import json,base64; v=json.load(open('engine.json')).get('value'); assert v, 'engine missing in the gatekeeper'; open('engine.tgz','wb').write(base64.b64decode(v))"
          tar xzf engine.tgz && rm -f engine.json engine.tgz && echo "engine ready: $(ls scindex | wc -l) files"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf==1.24.10 certifi
      - name: Walk orders, office reports and judgments
        run: |
          cd scindex
          if [ -n "${{ inputs.limit }}" ]; then python -u walk_orders.py --limit ${{ inputs.limit }}; else python -u walk_orders.py; fi
