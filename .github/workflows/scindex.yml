# Supreme Court cause-list archive, built on GitHub (owner, 26 Oct 2026): one year per run.
# Reads every daily list of the year from the Court's public archive (api.sci.gov.in/jonew/cl/...), one request at a
# time with a pause, then sends the lists and one line per listed matter into the owner's OneDrive ("ASDC Data") through
# the gatekeeper's intake (INGEST_KEY). No laptop involved.
# No copy is kept on GitHub (owner, 28 Oct 2026: the data is his edge) — files go straight to OneDrive.
name: SC cause-list archive (one year)
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year(s) to build, one after another: 2025  or  2026,2024,2023"
        required: true
        default: "2025"
concurrency:
  group: scindex
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  years:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.y.outputs.list }}
    steps:
      - id: y
        run: echo "list=$(echo '${{ inputs.year }}' | python3 -c 'import sys,json; print(json.dumps([y.strip() for y in sys.stdin.read().split(",") if y.strip()]))')" >> "$GITHUB_OUTPUT"
  build:
    needs: years
    strategy:
      max-parallel: 1          # one year at a time: one request at a time to the Court
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.years.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SCI_OUT: ${{ github.workspace }}/out
      GATEKEEPER_URL: https://asdc-gatekeeper.sdentertainmentservices.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Get the engine (kept privately in the gatekeeper, not in this public repo)
        env:
          GATEKEEPER_URL: https://asdc-gatekeeper.sdentertainmentservices.workers.dev
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          curl -sf -A "ASDC engine fetch" -X POST "$GATEKEEPER_URL/api/ingest/kvget" -H "X-Ingest-Key: $INGEST_KEY" \
               -H "Content-Type: application/json" -d '{"key":"sci:engine"}' -o engine.json
          python3 -c "import json,base64; v=json.load(open('engine.json')).get('value'); assert v, 'engine missing in the gatekeeper'; open('engine.tgz','wb').write(base64.b64decode(v))"
          tar xzf engine.tgz && rm -f engine.json engine.tgz && echo "engine ready: $(ls scindex | wc -l) files"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf==1.24.10 certifi
      - name: Build the year
        run: |
          cp fetch_causelist.py scindex/
          cd scindex && python -u build_year.py ${{ matrix.year }}
      - name: Send to OneDrive
        if: ${{ always() }}
        env:
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          PROBE: https://api.sci.gov.in/jonew/cl/2025-11-18/M_J_2.pdf
        run: |
          if [ -z "$INGEST_KEY" ]; then echo "INGEST_KEY not set - nothing sent"; exit 0; fi
          python -u scindex/push_onedrive.py
