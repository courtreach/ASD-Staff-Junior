# Daily top-up of the cause-list archive and the information categories (owner, 28 Oct 2026). Twice a day
# (08:00 and 23:30 IST) it asks the Court's archive for any daily list of the last 4 days and tomorrow that is not in
# the readings yet (one request at a time), saves the PDFs into OneDrive ("ASDC Data/SC Cause Lists/<year>"), reads
# them with the full reader, rebuilds every category file and sends "ASDC Data/SC Data" (with its Readings) to OneDrive.
# The readings are carried from run to run in GitHub's private build cache (not downloadable by the public).
# "dates": fetch particular dates instead (e.g. 2025-08-28 for lists missed earlier). If the cache is ever lost, the
# readings are restored from OneDrive ("SC Data/Readings") — no copy of the data is kept on GitHub.
name: SC daily top-up
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional: particular dates, comma separated (YYYY-MM-DD)"
        required: false
        default: ""
concurrency:
  group: scdaily
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      SCI_OUT: ${{ github.workspace }}/out
      GATEKEEPER_URL: https://asdc-gatekeeper.sdentertainmentservices.workers.dev
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the engine (kept privately in the gatekeeper, not in this public repo)
        env:
          GATEKEEPER_URL: https://asdc-gatekeeper.sdentertainmentservices.workers.dev
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          curl -sf -A "ASDC engine fetch" -X POST "$GATEKEEPER_URL/api/ingest/kvget" -H "X-Ingest-Key: $INGEST_KEY" \
               -H "Content-Type: application/json" -d '{"key":"sci:engine"}' -o engine.json
          python3 -c "import json,base64; v=json.load(open('engine.json')).get('value'); assert v, 'engine missing in the gatekeeper'; open('engine.tgz','wb').write(base64.b64decode(v))"
          tar xzf engine.tgz && rm -f engine.json engine.tgz && echo "engine ready: $(ls scindex | wc -l) files"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf==1.24.10 certifi
      - name: Readings from the last run
        uses: actions/cache/restore@v4
        with:
          path: parsed
          key: scparsed-${{ github.run_id }}
          restore-keys: scparsed-
      - name: Check the readings are there
        run: |
          n=$(ls parsed/items\ *.jsonl.gz 2>/dev/null | wc -l)
          echo "years in the readings: $n"; [ "$n" -ge 10 ] || { echo "readings missing - restore SC Data/Readings from OneDrive"; exit 1; }
      - name: New lists
        run: |
          cd scindex
          if [ -n "${{ inputs.dates }}" ]; then python -u daily_update.py ../parsed ../out --dates "${{ inputs.dates }}"; else python -u daily_update.py ../parsed ../out; fi
      - name: Rebuild the categories
        run: |
          python -u scindex/build_categories.py parsed "out/SC Data"
          mkdir -p "out/SC Data/Readings" && cp parsed/*.jsonl.gz "out/SC Data/Readings/"
      - name: Links for the own-cases fetcher (tagged cases' later numbers, and leads that are not own cases)
        continue-on-error: true
        run: python -u scindex/own_links.py "out/SC Data"
      - name: Lookup files for the owner's private Court data screen (morning run, or when run by hand)
        if: ${{ github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch' }}
        run: python -u scindex/build_lookup.py "out/SC Data" parsed "out/SC Data/Lookup"
      - name: Listing index for one-case answers to PaperBook's server (morning run, or when run by hand)
        if: ${{ github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        run: python -u scindex/build_plan.py "out/SC Data" "out/SC Data/Lookup"
      - name: Send to OneDrive
        run: python -u scindex/push_onedrive.py
      - name: Keep the readings for the next run
        uses: actions/cache/save@v4
        with:
          path: parsed
          key: scparsed-${{ github.run_id }}
