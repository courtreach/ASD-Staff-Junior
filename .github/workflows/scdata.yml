# Cause-list data sorted into information categories (owner, 28 Oct 2026). Re-reads every saved cause list with the
# full reader (scindex/parse_v2.py), builds ~30 category files (scindex/build_categories.py) and sends them to the
# owner's OneDrive, "ASDC Data/SC Data". The lists come from the archive job's own saved copies (no Court requests).
# Intermediate files are kept on GitHub for one day only.
name: SC data categories
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to read"
        required: true
        default: "2017,2018,2019,2020,2021,2022,2023,2024,2025,2026"
permissions:
  contents: read
  actions: read
jobs:
  years:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.y.outputs.list }}
    steps:
      - id: y
        run: echo "list=$(echo '${{ inputs.years }}' | python3 -c 'import sys,json; print(json.dumps([y.strip() for y in sys.stdin.read().split(",") if y.strip()]))')" >> "$GITHUB_OUTPUT"
  read:
    needs: years
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.years.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf==1.24.10
      - name: Which archive run holds this year
        id: src
        run: echo "run=$([ '${{ matrix.year }}' = '2025' ] && echo 40278248722 || echo 40338128391)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: sc-archive-${{ matrix.year }}
          path: arch
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the year
        run: python -u scindex/parse_year.py "arch/SC Cause Lists/${{ matrix.year }}" parsed
      - uses: actions/upload-artifact@v4
        with:
          name: scparsed-${{ matrix.year }}
          path: parsed/
          retention-days: 1
  build:
    needs: read
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SCI_OUT: ${{ github.workspace }}/out
      GATEKEEPER_URL: https://asdc-gatekeeper.sdentertainmentservices.workers.dev
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install certifi
      - uses: actions/download-artifact@v4
        with:
          pattern: scparsed-*
          merge-multiple: true
          path: parsed
      - name: Build the categories
        run: python -u scindex/build_categories.py parsed "out/SC Data"
      - name: Send to OneDrive
        run: python -u scindex/push_onedrive.py
